<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request List</title>
  <link rel="stylesheet" href="../../assets/styles/globals.css">
  <link rel="stylesheet" href="../../assets/styles/requests.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="header">
    <div class="logo">
      <img src="../assets/logo/FilmoPicks Large Logo (Dark).svg" alt="FilmoPicks Logo" class="logo-img">
    </div>
    <div class="user-section">
      <div class="notification">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell-fill"
          viewBox="0 0 16 16">
          <path
            d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901" />
        </svg>
      </div>
      <span class="admin-text">Admin</span>
      <div class="avatar"></div>
    </div>
  </div>

  <div class="container">
    <h1>Request List</h1>

    <button class="back-btn"><svg style="color: white" width="24" height="24" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M10 2C10 1.57279 9.72862 1.19277 9.32454 1.05413C8.92046 0.915482 8.47293 1.04884 8.21065 1.38606L1.21065 10.3861C0.929784 10.7472 0.929784 11.2528 1.21065 11.6139L8.21065 20.6139C8.47293 20.9512 8.92046 21.0845 9.32454 20.9459C9.72862 20.8072 10 20.4272 10 20V16.0102C15.3788 16.1223 17.9631 17.1431 19.2613 18.2532C20.4954 19.3085 20.7201 20.5489 20.9557 21.8492L20.9558 21.8496C20.9759 21.9606 20.9961 22.0721 21.017 22.1838C21.1098 22.6798 21.5576 23.029 22.0613 22.9981C22.5649 22.9672 22.9666 22.5659 22.9981 22.0623C23.1695 19.3143 22.9121 15.3323 20.9709 12.0007C19.0871 8.7677 15.6945 6.28195 10 6.02241V2Z"
          fill="white"></path>
      </svg></button>


    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="all">ALL</button>
      <button class="tab" data-tab="pending">PENDING</button>
      <button class="tab" data-tab="approved">APPROVED</button>
      <button class="tab" data-tab="rejected">REJECTED</button>
    </div>
    <!-- Unified Section: Control Panel + Content -->
    <div class="unified-section">
      <!-- Control Panel -->
      <div class="control-panel">
        <!-- Search and Sort -->
        <div class="search-sort-section">
          <div class="search-requests">
            <input type="text" placeholder="Search requests..." id="searchInput">
          </div>
          <div class="controls-right">
            <div class="sort-section">
              <span class="sort-icon">⇅</span>
              <span>Sort by:</span>
              <div class="sort-dropdown">
                <button class="sort-button" id="sortButton">Earliest</button>
                <div class="dropdown-menu" id="dropdownMenu">
                  <div class="dropdown-item" data-sort="earliest">Earliest</div>
                  <div class="dropdown-item" data-sort="latest">Latest</div>
                </div>
              </div>
            </div>
            <div class="view-toggle">
              <button class="view-btn" id="gridViewBtn">⊞</button>
              <button class="view-btn active" id="listViewBtn">☰</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <!-- List View -->
        <div id="listView">
          <div class="table-header">
            <div>Title</div>
            <div>Submitted by</div>
            <div>Request Type</div>
            <div>Date Submitted</div>
            <div>Status</div>
          </div>
          <div id="requestList"></div>
        </div>

        <!-- Grid View -->
        <div id="gridView" class="grid-view hidden"></div>

        <!-- Pending View with Actions -->
        <div id="pendingView" class="pending-grid hidden"></div>
      </div>
    </div>
    <div class="bulk-actions hidden" id="bulkActions">
      <button class="bulk-btn approve-all-btn">APPROVE ALL</button>
      <button class="bulk-btn reject-all-btn">REJECT ALL</button>
    </div>
  </div>
  <script src="../../assets/scripts/requests.js"></script>
</body>

</html>
