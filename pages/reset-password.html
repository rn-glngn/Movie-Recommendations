<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/logo/FilmoPicks Small Logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles/reset-password.css">
    <link rel="stylesheet" href="assets/styles/globals.css">
    <title>Reset Password - FilmoPicks</title>
</head>
<body>
    <div class="reset-container">
        <div class="logo-container">
            <img src="assets/logo/FilmoPicks Large Logo (Dark).svg" alt="FilmoPicks Logo">
        </div>

        <div class="icon">🔒</div>

        <h1 class="reset-title">Reset Password</h1>
        <p class="reset-subtitle">Enter your email and we'll send you a link to reset your password</p>

        <div class="success-message" id="successMessage">
            ✓ Password reset link sent! Check your email.
        </div>

        <form id="resetForm" action="#" method="POST">
            <div class="form-group">
                <label for="reset-email" class="form-label">Email Address</label>
                <input type="email" id="reset-email" name="reset-email" class="form-input" placeholder="Enter your email" required>
            </div>

            <button type="submit" class="btn-reset">Send Reset Link</button>
        </form>

        <div class="back-to-login">
            <a href="pages/login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const successMessage = document.getElementById('successMessage');

        // Handle reset form submission
        resetForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Show success message
            successMessage.classList.add('show');
            
            // Hide success message and redirect to login after 3 seconds
            setTimeout(() => {
                window.location.href = 'pages/login.html';
            }, 3000);
        });
    </script>
</body>
</html>
